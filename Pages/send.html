<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Notifications — Envoyer</title>
</head>
<body>
<div id="JellyNotifSendPage"
     data-role="page"
     class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select">

    <div data-role="content">
        <div class="content-primary">

            <style>
                .vn-page-header {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    flex-wrap: wrap;
                    gap: 12px;
                    margin-bottom: 24px;
                }
                .vn-page-header h2 {
                    font-size: 1.35rem;
                    font-weight: 600;
                    color: rgba(255,255,255,.87);
                    margin: 0;
                }
                .vn-page-header-sub {
                    font-size: .82rem;
                    color: rgba(255,255,255,.4);
                    margin: 2px 0 0;
                }
                .vn-nav-link {
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    padding: 7px 14px;
                    border: 1px solid rgba(255,255,255,.08);
                    border-radius: 4px;
                    color: rgba(255,255,255,.5);
                    text-decoration: none;
                    font-size: .82rem;
                    transition: color .15s, border-color .15s;
                }
                .vn-nav-link:hover { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.15); }
                .vn-nav-link svg { width: 14px; height: 14px; flex-shrink: 0; }

                .vn-section { margin-bottom: 24px; }
                .vn-section-label {
                    font-size: .7rem;
                    font-weight: 600;
                    text-transform: uppercase;
                    letter-spacing: .8px;
                    color: rgba(255,255,255,.3);
                    margin: 0 0 14px;
                }
                .vn-row {
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 16px;
                }
                @media (max-width: 600px) { .vn-row { grid-template-columns: 1fr; } }

                .vn-type-group { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
                .vn-type-option {
                    padding: 6px 14px;
                    border: 1px solid rgba(255,255,255,.08);
                    border-radius: 4px;
                    color: rgba(255,255,255,.45);
                    font-size: .82rem;
                    cursor: pointer;
                    transition: color .15s, border-color .15s, background .15s;
                    background: transparent;
                }
                .vn-type-option:hover { border-color: rgba(255,255,255,.15); color: rgba(255,255,255,.7); }
                .vn-type-option.selected {
                    border-color: #00a4dc;
                    color: #00a4dc;
                    background: rgba(0,164,220,.06);
                }

                .vn-charcount {
                    font-size: .7rem;
                    color: rgba(255,255,255,.25);
                    text-align: right;
                    margin-top: 3px;
                    transition: color .15s;
                }
                .vn-charcount.near { color: rgba(245,166,35,.6); }
                .vn-charcount.limit { color: rgba(224,62,62,.7); }

                .vn-actions { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
                .vn-submit {
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    padding: 9px 22px;
                    background: #00a4dc;
                    border: none;
                    border-radius: 4px;
                    color: #fff;
                    font-size: .85rem;
                    font-weight: 600;
                    cursor: pointer;
                    transition: background .15s;
                }
                .vn-submit:hover:not(:disabled) { background: #0090c5; }
                .vn-submit:disabled { opacity: .4; cursor: default; }
                .vn-submit svg { width: 15px; height: 15px; }

                .vn-feedback {
                    display: none;
                    padding: 10px 14px;
                    border-radius: 4px;
                    font-size: .82rem;
                    margin-top: 16px;
                }
                .vn-feedback.ok  { background: rgba(76,175,80,.08); border: 1px solid rgba(76,175,80,.15); color: rgba(76,175,80,.85); }
                .vn-feedback.err { background: rgba(224,62,62,.08); border: 1px solid rgba(224,62,62,.15); color: rgba(224,62,62,.85); }

                .vn-divider { border: none; border-top: 1px solid rgba(255,255,255,.04); margin: 0 0 24px; }
            </style>

            <div class="vn-page-header">
                <div>
                    <h2>Envoyer une notification</h2>
                    <div class="vn-page-header-sub">Diffuse un message aux utilisateurs du serveur</div>
                </div>
                <a href="/web/index.html#!/configurationpage?name=JellyNotifHistory" class="vn-nav-link">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/>
                    </svg>
                    Historique
                </a>
            </div>

            <hr class="vn-divider">

            <div class="vn-section">
                <div class="vn-section-label">Configuration</div>
                <div class="vn-row">
                    <div class="selectContainer">
                        <label class="selectLabel" for="vn-targetUser">Destinataire</label>
                        <select is="emby-select" id="vn-targetUser" class="emby-select-withcolor emby-select">
                            <option value="All">Tous les utilisateurs</option>
                        </select>
                    </div>
                    <div>
                        <label class="selectLabel">Type</label>
                        <div class="vn-type-group">
                            <div class="vn-type-option selected" data-type="Info">Info</div>
                            <div class="vn-type-option" data-type="Warning">Avertissement</div>
                            <div class="vn-type-option" data-type="Alert">Alerte</div>
                        </div>
                        <input type="hidden" id="vn-selectedType" value="Info">
                    </div>
                </div>
            </div>

            <div class="vn-section">
                <div class="vn-section-label">Contenu</div>
                <div class="inputContainer" style="margin-bottom:14px;">
                    <label class="inputLabel inputLabelUnfocused" for="vn-notifTitle">Titre</label>
                    <input is="emby-input" id="vn-notifTitle" type="text" maxlength="120"
                           placeholder="Ex : Maintenance planifiée" />
                    <div class="vn-charcount" id="vn-titleCount">0 / 120</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="vn-notifMessage">Message</label>
                    <textarea id="vn-notifMessage" rows="5" class="emby-input"
                              placeholder="Contenu de la notification…" maxlength="2000"
                              style="width:100%;resize:vertical;"></textarea>
                    <div class="vn-charcount" id="vn-msgCount">0 / 2000</div>
                </div>
            </div>

            <div class="vn-actions">
                <button type="button" id="vn-submitBtn" class="vn-submit">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    Envoyer
                </button>
            </div>

            <div id="vn-send-feedback" class="vn-feedback"></div>

        </div>
    </div>

    <script type="text/javascript">
    (function () {
        'use strict';

        function getAuth() {
            try {
                var creds = JSON.parse(localStorage.getItem('jellyfin_credentials'));
                if (!creds || !creds.Servers || !creds.Servers.length) return null;
                var srv = creds.Servers.find(function(s) { return s.AccessToken; }) || creds.Servers[0];
                return { token: srv.AccessToken, userId: srv.UserId };
            } catch (e) { return null; }
        }

        function hdrs(auth) {
            return { 'Content-Type': 'application/json', 'Authorization': 'MediaBrowser Token="' + auth.token + '"' };
        }

        function showFeedback(msg, ok) {
            var el = document.getElementById('vn-send-feedback');
            el.textContent = msg;
            el.className = 'vn-feedback ' + (ok ? 'ok' : 'err');
            el.style.display = 'block';
            clearTimeout(el._t);
            el._t = setTimeout(function() { el.style.display = 'none'; }, 4000);
        }

        // Type pills
        document.querySelectorAll('.vn-type-option').forEach(function(pill) {
            pill.addEventListener('click', function() {
                document.querySelectorAll('.vn-type-option').forEach(function(p) { p.classList.remove('selected'); });
                pill.classList.add('selected');
                document.getElementById('vn-selectedType').value = pill.dataset.type;
            });
        });

        // Char counters
        function bindCount(inputId, countId, max) {
            var el = document.getElementById(inputId);
            var ct = document.getElementById(countId);
            el.addEventListener('input', function() {
                var len = el.value.length;
                ct.textContent = len + ' / ' + max;
                ct.className = 'vn-charcount' + (len > max * .95 ? ' limit' : len > max * .8 ? ' near' : '');
            });
        }
        bindCount('vn-notifTitle', 'vn-titleCount', 120);
        bindCount('vn-notifMessage', 'vn-msgCount', 2000);

        // Admin guard + user list
        document.querySelector('#JellyNotifSendPage').addEventListener('pageshow', function () {
            var auth = getAuth();
            if (!auth) return;
            fetch('/Users/' + auth.userId, { headers: hdrs(auth) })
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(function(user) {
                    if (!user || !user.Policy || !user.Policy.IsAdministrator) {
                        showFeedback('Accès réservé aux administrateurs.', false);
                        document.getElementById('vn-submitBtn').disabled = true;
                        return;
                    }
                    return fetch('/Users', { headers: hdrs(auth) })
                        .then(function(r) { return r.ok ? r.json() : []; })
                        .then(function(users) {
                            var sel = document.getElementById('vn-targetUser');
                            while (sel.options.length > 1) sel.remove(1);
                            users.forEach(function(u) {
                                var opt = document.createElement('option');
                                opt.value = u.Id;
                                opt.textContent = u.Name;
                                sel.appendChild(opt);
                            });
                        });
                })
                .catch(function() {});
        });

        // Submit
        document.getElementById('vn-submitBtn').addEventListener('click', function () {
            var auth = getAuth();
            if (!auth) { showFeedback('Session expirée.', false); return; }

            var title   = document.getElementById('vn-notifTitle').value.trim();
            var message = document.getElementById('vn-notifMessage').value.trim();
            if (!title || !message) { showFeedback('Le titre et le message sont requis.', false); return; }
            if (title.length > 120)  { showFeedback('Le titre est trop long (max 120).', false); return; }
            if (message.length > 2000) { showFeedback('Le message est trop long (max 2000).', false); return; }

            var btn = document.getElementById('vn-submitBtn');
            btn.disabled = true;

            fetch('/Notification/Send', {
                method: 'POST', headers: hdrs(auth),
                body: JSON.stringify({
                    title: title, message: message,
                    targetUserId: document.getElementById('vn-targetUser').value,
                    type: document.getElementById('vn-selectedType').value
                })
            })
            .then(function(res) {
                if (res.status === 201) {
                    showFeedback('Notification envoyée.', true);
                    document.getElementById('vn-notifTitle').value = '';
                    document.getElementById('vn-notifMessage').value = '';
                    document.getElementById('vn-titleCount').textContent = '0 / 120';
                    document.getElementById('vn-msgCount').textContent = '0 / 2000';
                } else {
                    res.text().then(function(err) {
                        showFeedback('Erreur ' + res.status + ' : ' + (err || '').substring(0, 200), false);
                    });
                }
            })
            .catch(function() { showFeedback('Erreur réseau.', false); })
            .finally(function() { btn.disabled = false; });
        });
    })();
    </script>
</div>
</body>
</html>
