<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Notifications — Historique</title>
</head>
<body>
<div id="JellyNotifHistoryPage"
     data-role="page"
     class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select">

    <div data-role="content">
        <div class="content-primary">

            <style>
                .vn-page-header {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    flex-wrap: wrap;
                    gap: 12px;
                    margin-bottom: 24px;
                }
                .vn-page-header h2 { font-size: 1.35rem; font-weight: 600; color: rgba(255,255,255,.87); margin: 0; }
                .vn-page-header-sub { font-size: .82rem; color: rgba(255,255,255,.4); margin: 2px 0 0; }
                .vn-nav-link {
                    display: inline-flex; align-items: center; gap: 6px;
                    padding: 7px 14px; border: 1px solid rgba(255,255,255,.08);
                    border-radius: 4px; color: rgba(255,255,255,.5);
                    text-decoration: none; font-size: .82rem;
                    transition: color .15s, border-color .15s;
                }
                .vn-nav-link:hover { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.15); }
                .vn-nav-link svg { width: 14px; height: 14px; }

                .vn-divider { border: none; border-top: 1px solid rgba(255,255,255,.04); margin: 0 0 24px; }

                /* Stats */
                .vn-stats {
                    display: flex; gap: 1px; margin-bottom: 20px;
                    background: rgba(255,255,255,.04); border-radius: 4px; overflow: hidden;
                }
                .vn-stat {
                    flex: 1; padding: 12px 16px; text-align: center;
                    background: rgba(0,0,0,.15);
                }
                .vn-stat-val { font-size: 1.3rem; font-weight: 700; line-height: 1; }
                .vn-stat-lbl { font-size: .65rem; text-transform: uppercase; letter-spacing: .6px; color: rgba(255,255,255,.3); margin-top: 4px; }

                /* Filters */
                .vn-filters {
                    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
                    margin-bottom: 16px;
                }
                .vn-search {
                    flex: 1; min-width: 140px;
                    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
                    border-radius: 4px; color: rgba(255,255,255,.7); padding: 7px 10px;
                    font-size: .82rem; outline: none; transition: border-color .15s;
                }
                .vn-search:focus { border-color: rgba(0,164,220,.35); }
                .vn-search::placeholder { color: rgba(255,255,255,.2); }

                .vn-btn-sm {
                    padding: 7px 12px; font-size: .78rem;
                    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
                    border-radius: 4px; color: rgba(255,255,255,.45); cursor: pointer;
                    transition: color .15s, border-color .15s;
                }
                .vn-btn-sm:hover { color: rgba(255,255,255,.75); border-color: rgba(255,255,255,.12); }

                /* Table */
                .vn-table-wrap {
                    border: 1px solid rgba(255,255,255,.04);
                    border-radius: 4px; overflow: hidden;
                }
                .vn-table { width: 100%; border-collapse: collapse; }
                .vn-table thead th {
                    text-align: left; padding: 10px 14px; font-size: .7rem;
                    font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
                    color: rgba(255,255,255,.3); background: rgba(255,255,255,.02);
                    border-bottom: 1px solid rgba(255,255,255,.04);
                    cursor: pointer; user-select: none; white-space: nowrap;
                    transition: color .15s;
                }
                .vn-table thead th:hover { color: rgba(255,255,255,.5); }
                .vn-table thead th .vn-arr { opacity: .3; margin-left: 3px; font-size: .65rem; }
                .vn-table thead th.sorted .vn-arr { opacity: .8; color: #00a4dc; }
                .vn-table tbody tr {
                    cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.025);
                    transition: background .1s;
                }
                .vn-table tbody tr:hover { background: rgba(255,255,255,.02); }
                .vn-table td { padding: 10px 14px; font-size: .84rem; color: rgba(255,255,255,.65); }

                /* Type tag */
                .vn-tag {
                    display: inline-block; padding: 2px 8px; border-radius: 3px;
                    font-size: .72rem; font-weight: 600;
                }
                .vn-tag-info    { background: rgba(0,164,220,.08); color: #00a4dc; }
                .vn-tag-warning { background: rgba(245,166,35,.08); color: #c8890e; }
                .vn-tag-alert   { background: rgba(224,62,62,.08); color: #c03030; }

                /* Expand */
                .vn-expand td {
                    padding: 12px 20px; font-size: .82rem; color: rgba(255,255,255,.4);
                    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
                    border-left: 2px solid rgba(255,255,255,.06);
                }

                /* Sent dot */
                .vn-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 5px; }
                .vn-dot-ok { background: #4caf50; }
                .vn-dot-no { background: rgba(255,255,255,.12); }

                /* States */
                .vn-loader { text-align: center; padding: 36px; color: rgba(255,255,255,.3); font-size: .85rem; }
                .vn-spinner {
                    width: 24px; height: 24px;
                    border: 2px solid rgba(255,255,255,.06);
                    border-top-color: #00a4dc;
                    border-radius: 50%;
                    animation: vn-spin .8s linear infinite;
                    margin: 0 auto 10px;
                }
                @keyframes vn-spin { to { transform: rotate(360deg); } }
                .vn-empty { text-align: center; padding: 40px 20px; color: rgba(255,255,255,.25); font-size: .85rem; }
            </style>

            <div class="vn-page-header">
                <div>
                    <h2>Historique des notifications</h2>
                    <div class="vn-page-header-sub">Suivi des notifications envoyées</div>
                </div>
                <a href="/web/index.html#!/configurationpage?name=JellyNotifSend" class="vn-nav-link">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    Envoyer
                </a>
            </div>

            <hr class="vn-divider">

            <div id="vn-h-stats" class="vn-stats"></div>

            <div class="vn-filters">
                <select is="emby-select" id="vn-h-filterType" class="emby-select-withcolor emby-select" style="min-width:120px;">
                    <option value="">Tous types</option>
                    <option value="Info">Info</option>
                    <option value="Warning">Avertissement</option>
                    <option value="Alert">Alerte</option>
                </select>
                <select is="emby-select" id="vn-h-filterTarget" class="emby-select-withcolor emby-select" style="min-width:140px;">
                    <option value="">Tous</option>
                    <option value="All">Global</option>
                </select>
                <input type="text" id="vn-h-search" class="vn-search" placeholder="Rechercher…" />
                <button type="button" id="vn-h-refreshBtn" class="vn-btn-sm">Actualiser</button>
            </div>

            <div id="vn-h-loader" class="vn-loader" style="display:none;">
                <div class="vn-spinner"></div>Chargement…
            </div>
            <div id="vn-h-empty" class="vn-empty" style="display:none;">Aucune notification.</div>

            <div class="vn-table-wrap" id="vn-h-tableWrap" style="display:none;">
                <table class="vn-table">
                    <thead><tr>
                        <th data-col="title">Titre <span class="vn-arr">↕</span></th>
                        <th data-col="targetUserId">Dest. <span class="vn-arr">↕</span></th>
                        <th data-col="type">Type <span class="vn-arr">↕</span></th>
                        <th data-col="dateCreated">Date <span class="vn-arr">↕</span></th>
                        <th data-col="isSent">Envoi <span class="vn-arr">↕</span></th>
                        <th data-col="readCount">Lus <span class="vn-arr">↕</span></th>
                    </tr></thead>
                    <tbody id="vn-h-tbody"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script type="text/javascript">
    (function () {
        'use strict';
        var allData = [], userMap = {}, sortCol = 'dateCreated', sortAsc = false;

        function getAuth() {
            try {
                var c = JSON.parse(localStorage.getItem('jellyfin_credentials'));
                if (!c || !c.Servers || !c.Servers.length) return null;
                var s = c.Servers.find(function(x){return x.AccessToken;}) || c.Servers[0];
                return { token: s.AccessToken };
            } catch(e) { return null; }
        }
        function hdrs(a) { return {'Content-Type':'application/json','Authorization':'MediaBrowser Token="'+a.token+'"'}; }
        function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

        function tag(t) {
            var c = {Info:'info',Warning:'warning',Alert:'alert'}[t]||'info';
            return '<span class="vn-tag vn-tag-'+c+'">'+esc(t)+'</span>';
        }
        function stat(v, l, color) {
            return '<div class="vn-stat"><div class="vn-stat-val" style="color:'+color+'">'+v+'</div><div class="vn-stat-lbl">'+l+'</div></div>';
        }

        function loadUsers(a) {
            return fetch('/Users',{headers:hdrs(a)}).then(function(r){return r.ok?r.json():[];}).then(function(u){
                var sel=document.getElementById('vn-h-filterTarget');
                u.forEach(function(x){userMap[x.Id]=x.Name;var o=document.createElement('option');o.value=x.Id;o.textContent=x.Name;sel.appendChild(o);});
            }).catch(function(){});
        }

        function load() {
            var a=getAuth(); if(!a){empty('Session expirée.');return;}
            document.getElementById('vn-h-loader').style.display='block';
            document.getElementById('vn-h-tableWrap').style.display='none';
            document.getElementById('vn-h-empty').style.display='none';
            fetch('/Notification/Admin/History',{headers:hdrs(a)}).then(function(r){
                if(!r.ok)throw new Error('HTTP '+r.status); return r.json();
            }).then(function(d){allData=d;renderStats();renderTable();})
            .catch(function(e){empty('Erreur : '+e.message);})
            .finally(function(){document.getElementById('vn-h-loader').style.display='none';});
        }

        function empty(m) {
            var el=document.getElementById('vn-h-empty');
            el.textContent=m; el.style.display='block';
            document.getElementById('vn-h-tableWrap').style.display='none';
        }

        function renderStats() {
            var t=allData.length;
            var i=allData.filter(function(n){return n.type==='Info';}).length;
            var w=allData.filter(function(n){return n.type==='Warning';}).length;
            var a=allData.filter(function(n){return n.type==='Alert';}).length;
            document.getElementById('vn-h-stats').innerHTML=
                stat(t,'Total','rgba(255,255,255,.7)')+stat(i,'Info','#00a4dc')+stat(w,'Avert.','#c8890e')+stat(a,'Alertes','#c03030');
        }

        function renderTable() {
            var q=document.getElementById('vn-h-search').value.toLowerCase();
            var ft=document.getElementById('vn-h-filterType').value;
            var fg=document.getElementById('vn-h-filterTarget').value;

            var data=allData.filter(function(n){
                if(ft&&n.type!==ft)return false;
                if(fg&&n.targetUserId!==fg)return false;
                if(q&&n.title.toLowerCase().indexOf(q)===-1&&n.message.toLowerCase().indexOf(q)===-1)return false;
                return true;
            });
            data.sort(function(a,b){
                var va=a[sortCol],vb=b[sortCol];
                if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}
                if(typeof va==='boolean'){va=va?1:0;vb=vb?1:0;}
                if(va<vb)return sortAsc?-1:1; if(va>vb)return sortAsc?1:-1; return 0;
            });

            document.querySelectorAll('.vn-table thead th[data-col]').forEach(function(th){
                var ar=th.querySelector('.vn-arr');
                if(th.dataset.col===sortCol){ar.textContent=sortAsc?'↑':'↓';th.classList.add('sorted');}
                else{ar.textContent='↕';th.classList.remove('sorted');}
            });

            var tb=document.getElementById('vn-h-tbody'); tb.innerHTML='';
            if(!data.length){empty('Aucune notification.');return;}
            document.getElementById('vn-h-empty').style.display='none';
            document.getElementById('vn-h-tableWrap').style.display='block';

            data.forEach(function(n,idx){
                var tgt=n.targetUserId==='All'?'Global':(userMap[n.targetUserId]||n.targetUserId.slice(0,8)+'…');
                var dt=new Date(n.dateCreated).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
                var eid='vn-x-'+idx;

                var tr=document.createElement('tr');
                tr.innerHTML='<td style="color:rgba(255,255,255,.8);font-weight:500">'+esc(n.title)+'</td>'+
                    '<td>'+esc(tgt)+'</td><td>'+tag(n.type)+'</td>'+
                    '<td style="font-size:.78rem;white-space:nowrap">'+dt+'</td>'+
                    '<td><span class="vn-dot '+(n.isSent?'vn-dot-ok':'vn-dot-no')+'"></span>'+(n.isSent?'Oui':'Non')+'</td>'+
                    '<td>'+n.readCount+'</td>';
                tr.addEventListener('click',function(){var r=document.getElementById(eid);r.style.display=r.style.display==='none'?'table-row':'none';});
                tb.appendChild(tr);

                var xtr=document.createElement('tr'); xtr.id=eid; xtr.className='vn-expand'; xtr.style.display='none';
                var xtd=document.createElement('td'); xtd.colSpan=6;
                xtd.textContent=n.message; xtr.appendChild(xtd); tb.appendChild(xtr);
            });
        }

        document.getElementById('vn-h-search').addEventListener('input',renderTable);
        document.getElementById('vn-h-filterType').addEventListener('change',renderTable);
        document.getElementById('vn-h-filterTarget').addEventListener('change',renderTable);
        document.getElementById('vn-h-refreshBtn').addEventListener('click',load);

        document.querySelectorAll('.vn-table thead th[data-col]').forEach(function(th){
            th.addEventListener('click',function(){
                var c=th.dataset.col;
                if(sortCol===c)sortAsc=!sortAsc; else{sortCol=c;sortAsc=true;}
                renderTable();
            });
        });

        document.querySelector('#JellyNotifHistoryPage').addEventListener('pageshow',function(){
            var a=getAuth(); if(!a){empty('Session expirée.');return;}
            var c=JSON.parse(localStorage.getItem('jellyfin_credentials')||'{}');
            var s=(c.Servers||[]).find(function(x){return x.AccessToken;})||(c.Servers||[])[0];
            var uid=s&&s.UserId; if(!uid){empty('Session invalide.');return;}
            fetch('/Users/'+uid,{headers:{'Authorization':'MediaBrowser Token="'+a.token+'"'}})
                .then(function(r){return r.ok?r.json():null;})
                .then(function(u){
                    if(!u||!u.Policy||!u.Policy.IsAdministrator){empty('Accès réservé aux administrateurs.');return;}
                    loadUsers(a).then(function(){load();});
                }).catch(function(){empty('Erreur de vérification.');});
        });
    })();
    </script>
</div>
</body>
</html>
